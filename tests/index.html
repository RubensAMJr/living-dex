<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Dex tests</title>
<style>
  :root { color-scheme: dark; --bg: #2b2b2b; --panel: #383838; --ok: #79b052; --bad: #e0533e; --dim: #9a9a9a; }
  body { margin: 0; background: var(--bg); color: #eee; font: 13px/1.5 Verdana, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 14px; align-items: center; padding: 10px 16px; background: #111; }
  .bar h1 { margin: 0; font-size: 16px; }
  .bar button { padding: 6px 14px; border-radius: 6px; border: 0; background: var(--ok); color: #111; font-weight: bold; cursor: pointer; }
  #summary { font-weight: bold; }
  #summary.ok { color: var(--ok); } #summary.bad { color: var(--bad); }
  main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 12px; padding: 12px 16px; }
  ol { margin: 0; padding: 0; list-style: none; }
  li { padding: 6px 10px; margin-bottom: 4px; background: var(--panel); border-radius: 6px; border-left: 4px solid var(--dim); }
  li.ok { border-color: var(--ok); } li.bad { border-color: var(--bad); }
  li small { display: block; color: var(--dim); white-space: pre-wrap; }
  iframe { width: 100%; height: 820px; border: 1px solid #555; border-radius: 6px; background: #383838; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar"><h1>Living Dex tests</h1><button id="run">Run again</button><span id="summary">running…</span></div>
<main>
  <ol id="results"></ol>
  <iframe id="app" title="App under test"></iframe>
</main>
<script src="app-tests.js"></script>
</body>
</html>
